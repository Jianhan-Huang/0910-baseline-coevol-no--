name: Finalize temporal benchmark adaptation

on:
  push:
    branches: [main]
    paths:
      - '.staging/train.part.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble verified training integration
        run: |
          cat .staging/train.part.0 .staging/train.part.1 .staging/train.part.2 .staging/train.part.3 > tasks/pde_benchmarks/train.py
          test "$(git hash-object tasks/pde_benchmarks/train.py)" = "c45e02f8b0289a7012d6949960f26f122ddec266"
          rm -rf .staging
          rm -f .github/workflows/finalize-temporal-adaptation.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit final native integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate temporal benchmarks into official training loop'
          git push origin HEAD:main
