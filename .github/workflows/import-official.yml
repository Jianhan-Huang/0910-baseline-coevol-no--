name: Import official CoEvol-NO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-official.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official source snapshot
        run: |
          git clone --depth 1 https://github.com/IDLE-Cloud/CoEvol-NO.git /tmp/coevol-official
          rm -rf /tmp/coevol-official/.git
          rsync -a --delete --exclude '.git/' --exclude '.github/workflows/import-official.yml' /tmp/coevol-official/ ./
          rm -f .github/workflows/import-official.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit official baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import official CoEvol-NO source snapshot'
          git push origin HEAD:main
