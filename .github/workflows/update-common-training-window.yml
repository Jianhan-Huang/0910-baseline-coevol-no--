name: Update temporal training windows

on:
  push:
    paths:
      - '.github/workflows/update-common-training-window.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python .github/update_common_training_window.py
      - name: Commit migration
        run: |
          rm -f .github/update_common_training_window.py
          rm -f .github/workflows/update-common-training-window.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tasks/pde_benchmarks/temporal_data.py tasks/pde_benchmarks/train.py tests/test_temporal_adapter.py .github
          git commit -m 'Sample temporal training windows across full trajectories'
          git push
